apiVersion: apps/v1
kind: Deployment

metadata:
  name: myapp
  labels:
    app: myapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      # Secret used to authenticate with GitHub Container Registry
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: myapp
          image: ghcr.io/shubhamkri/agrocd-lab-app:sha-bc00950
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: myapp-config
            - secretRef:
                name: myapp-secret

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3