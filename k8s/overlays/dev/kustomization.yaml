apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: myapp-dev
resources:
  - ../../base
  - ../../hooks
patches:
  - target:
      kind: Deployment
      name: myapp
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
configMapGenerator:
  - name: myapp-config
    behavior: merge
    literals:
      - APP_COLOR=green
images:
  - name: ghcr.io/shubhamkri/argocd-lab-app
    newTag: latest
