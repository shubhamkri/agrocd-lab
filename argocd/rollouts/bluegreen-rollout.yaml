# Blue-Green for "prod". Two services: active (live traffic) and preview (test before promote).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: myapp-bluegreen
  namespace: myapp-prod
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: myapp-bluegreen
  template:
    metadata:
      labels:
        app: myapp-bluegreen
    spec:
      containers:
        - name: myapp
          image: ghcr.io/shubhamkri/argocd-lab-app:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
  strategy:
    blueGreen:
      activeService: myapp-active
      previewService: myapp-preview
      autoPromotionEnabled: false   # requires: kubectl argo rollouts promote myapp-bluegreen
      scaleDownDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-active
  namespace: myapp-prod
spec:
  selector:
    app: myapp-bluegreen
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-preview
  namespace: myapp-prod
spec:
  selector:
    app: myapp-bluegreen
  ports:
    - port: 80
      targetPort: 8080
