# Deploy to myapp-staging to see canary in action.
# Replaces the plain Deployment for progressive delivery.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: myapp-canary
  namespace: myapp-staging
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: myapp-canary
  template:
    metadata:
      labels:
        app: myapp-canary
    spec:
      containers:
        - name: myapp
          image: ghcr.io/shubhamkri/argocd-lab-app:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
      analysis:
        templates:
          - templateName: success-rate
        startingStep: 1
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-canary
  namespace: myapp-staging
spec:
  selector:
    app: myapp-canary
  ports:
    - port: 80
      targetPort: 8080
