apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myapp.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "myapp.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "myapp.name" . }}
    spec:
      containers:
        - name: myapp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        Why are there 3 ReplicaSets?
This is actually ver  ports:
            - containerPort: 8080
          env:
            - name: APP_COLOR
              value: {{ .Values.color | quote }}
            - name: APP_VERSION
              value: {{ .Values.version | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
